name: Android Appium Smoke Test

on:
  workflow_dispatch:
    inputs:
      cucumber_tags:
        description: "Cucumber tags to execute"
        required: true
        default: "@urpiproLogin"
        type: choice
        options:
          - "@urpiproLogin"
          - "@simularCredito"
          - "@validarClientesPorADN"

jobs:
  android-appium-smoke-test:
    name: Run Appium smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Appium and Android driver
        run: |
          npm install -g appium@2.19.0

          echo "Appium version:"
          appium --version

          echo "Cleaning previous Appium drivers..."
          appium driver uninstall uiautomator2 || true

          echo "Installing UiAutomator2 compatible with Appium 2..."
          appium driver install uiautomator2@4.2.9

          echo "Installed Appium drivers:"
          appium driver list --installed

      - name: Run Android Appium smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TAGS: ${{ github.event.inputs.cucumber_tags }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p artifacts/appium
            echo "Checking connected devices..."
            adb devices

            echo "Checking APK file..."
            test -f "apps/android/urpipro.apk" || (echo "APK not found at apps/android/urpipro.apk" && find . -maxdepth 4 -type f | sort && exit 1)

            echo "APK found:"
            ls -lh apps/android/urpipro.apk

            echo "Installing APK..."
            adb install -r apps/android/urpipro.apk

            echo "Starting Appium server..."
            export APPIUM_ALLOW_INSECURE=chromedriver_autodownload
            appium --address 127.0.0.1 --port 4723 --allow-insecure chromedriver_autodownload --log-level info > artifacts/appium/appium.log 2>&1 &

            echo "Waiting for Appium server..."
            npx wait-on http://127.0.0.1:4723/status --timeout 60000

            echo "Appium status:"
            curl -s http://127.0.0.1:4723/status || true

            echo "Chrome package version:"
            adb shell dumpsys package com.android.chrome | grep versionName || true

            echo "Android WebView update status:"
            adb shell dumpsys webviewupdate || true

            echo "Selected Cucumber tags: $TAGS"
            echo "Running WDIO tests..."
            npm run test:android

      - name: Upload Appium mobile test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-test-evidence
          path: |
            appium-server.log
            appium.log
            artifacts/appium
            reporte-mibanco
            reports
            allure-results
