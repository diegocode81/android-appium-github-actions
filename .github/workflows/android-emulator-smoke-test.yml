name: Android Emulator Smoke Test

on:
  workflow_dispatch:

jobs:
  android-emulator-smoke-test:
    name: Start Android Emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo "Enabling KVM access for Android Emulator..."
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "KVM permissions configured."

      - name: Start emulator and run smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Android emulator boot completed."

            echo "Listing connected adb devices..."
            adb devices

            echo "Reading Android version..."
            adb shell getprop ro.build.version.release

            echo "Reading emulator device model..."
            adb shell getprop ro.product.model

            echo "Checking animation scale setting..."
            adb shell settings get global window_animation_scale

            echo "Sending unlock/menu keyevent to emulator..."
            adb shell input keyevent 82

            echo "Confirming emulator command execution..."
            adb shell echo "Android emulator is running successfully"

      - name: Confirm POC completion
        run: |
          echo "POC completed: Android emulator started successfully"
