name: Android Emulator Smoke Test

on:
  workflow_dispatch:

jobs:
  android-emulator-smoke-test:
    name: Start Android Emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator and run smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Android emulator boot completed."

            echo "Creating emulator artifact directory..."
            mkdir -p artifacts/emulator

            echo "Listing connected devices..."
            adb devices

            echo "Android version:"
            adb shell getprop ro.build.version.release

            echo "Device model:"
            adb shell getprop ro.product.model

            echo "Unlocking emulator screen..."
            adb shell input keyevent 82 || true

            echo "Waiting for launcher..."
            sleep 5

            echo "Capturing emulator home screen..."
            adb exec-out screencap -p > artifacts/emulator/emulator-home-screen.png

            echo "Writing emulator device information..."
            echo "Android Emulator Smoke Test" > artifacts/emulator/device-info.txt
            echo "Date: $(date)" >> artifacts/emulator/device-info.txt
            echo "Android version: $(adb shell getprop ro.build.version.release)" >> artifacts/emulator/device-info.txt
            echo "Device model: $(adb shell getprop ro.product.model)" >> artifacts/emulator/device-info.txt
            echo "Device manufacturer: $(adb shell getprop ro.product.manufacturer)" >> artifacts/emulator/device-info.txt
            echo "SDK: $(adb shell getprop ro.build.version.sdk)" >> artifacts/emulator/device-info.txt
            echo "ADB devices:" >> artifacts/emulator/device-info.txt
            adb devices >> artifacts/emulator/device-info.txt

            echo "Generated emulator artifacts:"
            ls -lah artifacts/emulator

      - name: Upload emulator visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-visual-evidence
          path: artifacts/emulator

      - name: Confirm POC completion
        run: |
          echo "POC completed: Android emulator started and visual evidence was uploaded."
